[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-ads-brain"
version = "0.4.0"
description = "Sourced ChatGPT Ads knowledge and guarded operating skill pack."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mamdouh Aboammar"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/imMamdouhaboammar/chatgpt-ads"
Issues = "https://github.com/imMamdouhaboammar/chatgpt-ads/issues"

[tool.setuptools]
packages = ["chatgpt_ads_brain"]

[project.optional-dependencies]
validation = ["jsonschema>=4,<5"]
