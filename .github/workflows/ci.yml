name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install local validation dependency
        run: python -m pip install --require-hashes -r requirements/validation.txt
      - name: Run POSIX deterministic checks (Linux and macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/knowledge_core.py validate
          python scripts/knowledge_core.py sync-projection --check
          python scripts/validate_pack.py
          python -m unittest discover -s skills/chatgpt-ads/tests -p "test_*.py"
          python acceptance/workflows/verify.py
          python acceptance/measurement/run_offline_cases.py
          python scripts/doctor.py
          python -m pip wheel . --no-deps --wheel-dir .ci-dist
          python -m venv .ci-wheel
          .ci-wheel/bin/python -m pip install .ci-dist/chatgpt_ads_brain-*.whl
          .ci-wheel/bin/python -c "import chatgpt_ads_brain; print(chatgpt_ads_brain.__version__)"
          node bin/cli.js --help
          node bin/cli.js list-skills
          node bin/cli.js research "قياس التحويلات" --json
          npm pack --pack-destination .ci-dist
          tar -tzf .ci-dist/chatgpt-ads-brain-*.tgz | grep -E 'package/pyproject.toml|package/.skills.json'
          install_home="$(mktemp -d)"
          HOME="$install_home" bash install.sh --target "$install_home/chatgpt-ads"
          (cd "$install_home/chatgpt-ads" && python -m chatgpt_ads_brain validate)
      - name: Check the documented Windows capability boundary
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p "test_safe_io.py"
          python scripts/doctor.py --json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements/security.txt
      - run: python -m unittest discover -s tests -p "test_secret_scan.py"
      - run: python scripts/scan_secrets.py --history
